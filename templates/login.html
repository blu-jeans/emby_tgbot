<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emby Bot 管理后台 - 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-wrapper">
        <div class="glass-card login-card">
            <div class="logo-section">
                <div class="logo-icon">🤖</div>
                <h1>EMBY BOT</h1>
                <p>轻量级 Telegram 注册机器人管理后台</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid var(--error); border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 0.9rem; color: #fecaca; text-align: center;">
                            ⚠️ {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="username">管理账号</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="输入管理员用户名" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">安全密码</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="输入访问密码" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">安全登入</button>
            </form>
        </div>
    </div>
</body>
</html>
